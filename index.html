<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#09090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Recomp</title>
<style>
:root{
  --bg:#09090B; --card:#131317; --card2:#1B1B21; --card3:#24242B;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#F4F4F5; --mute:#9A9AA4; --dim:#5D5D67;
  --acc:#D4FF3A; --acc2:#9BE22B; --ink:#0B0C06;
  --blue:#64D2FF; --pr:#FFB340; --red:#FF7A7A;
  --r:22px; --r2:16px;
  --num: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 22px) 18px calc(var(--sab) + 120px)}
/* status-bar scrim: covers only the safe-area strip so scrolled content never collides with the clock/Dynamic Island */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);z-index:19;pointer-events:none;background:linear-gradient(to bottom,var(--bg) 70%,rgba(9,9,11,0))}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 16px}
.eyebrow{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.02em;text-transform:uppercase}
h1{font-size:34px;line-height:1.05;margin:4px 0 0;font-weight:800;letter-spacing:-.025em}
h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-.015em}
h3{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--mute);font-size:14px;line-height:1.4}
.tiny{font-size:12px;color:var(--dim)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);position:relative}
.sec{margin:26px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);color:var(--mute)}
.pill.acc{background:rgba(212,255,58,.12);color:var(--acc)}
.pill.pr{background:rgba(255,179,64,.14);color:var(--pr)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;font-weight:700;font-size:17px;background:var(--card2);width:100%;transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.acc{background:linear-gradient(180deg,#DFFF5E,#C3F02C);color:var(--ink);box-shadow:0 8px 24px -10px rgba(212,255,58,.55)}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.sm{height:40px;font-size:15px;border-radius:12px;width:auto;padding:0 14px}
.btn.danger{color:var(--red)}
.link{color:var(--acc);font-weight:600;font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 10px;border-radius:14px;transition:background .2s}
.wd .l{font-size:11px;font-weight:600;color:var(--dim)}
.wd .n{font-size:17px;font-weight:700;font-family:var(--num)}
.wd .dot{width:6px;height:6px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--dim)}
.wd .dot.rest{box-shadow:none;background:var(--card3)}
.wd .dot.done{box-shadow:none;background:var(--acc)}
.wd.today .n{color:var(--acc)}
.wd.sel{background:var(--card2)}
.hero{padding:20px;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,rgba(212,255,58,.10),transparent 55%),var(--card)}
.hero .title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.ring{position:relative;width:72px;height:72px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.ring .c small{font-size:10px;color:var(--mute);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r2);background:rgba(100,210,255,.08);border:1px solid rgba(100,210,255,.18);margin-bottom:12px;font-size:14px;line-height:1.35}
.banner b{color:var(--blue)}
.ex{padding:16px 14px 10px}
.ex-h{display:flex;align-items:flex-start;gap:10px;margin:0 2px 10px}
.ex-n{font-size:18px;font-weight:700;letter-spacing:-.01em}
.ex-p{font-size:13px;color:var(--mute);margin-top:3px}
.target{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--mute);background:var(--card2);border-radius:12px;padding:9px 12px;margin:0 0 10px;line-height:1.35}
.target b{color:var(--text);font-weight:600}
.target.up{background:rgba(212,255,58,.08);color:#cfe88a}
.target.up b{color:var(--acc)}
.target .ic{font-size:13px;flex:none;margin-top:1px}
.set{display:flex;align-items:center;gap:10px;min-height:58px;padding:4px 4px 4px 8px;border-radius:14px;transition:background .2s}
.set + .set{margin-top:2px}
.set .i{width:24px;font-size:13px;color:var(--dim);font-weight:700;font-family:var(--num)}
.set .v{flex:1;display:flex;align-items:baseline;gap:6px;font-family:var(--num);font-size:22px;font-weight:700;color:var(--dim);text-align:left;padding:8px 0}
.set .v .u{font-size:13px;font-weight:600;color:var(--dim)}
.set .v .x{font-size:15px;color:var(--dim);margin:0 2px}
.set.done .v{color:var(--text)}
.set.done .v .u{color:var(--mute)}
.set .rir{font-size:11px;color:var(--mute);font-weight:600;font-family:var(--num);padding:3px 7px;background:var(--card2);border-radius:7px;margin-left:6px;align-self:center}
.set .prb{font-size:11px;color:var(--pr);font-weight:700;margin-left:4px;align-self:center}
.chk{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--card2);flex:none;transition:transform .2s var(--ease),background .25s}
.chk svg{width:22px;height:22px;stroke:var(--dim);stroke-width:3;fill:none;transition:stroke .2s}
.chk:active{transform:scale(.88)}
.set.done .chk{background:var(--acc)}
.set.done .chk svg{stroke:var(--ink)}
.set.pop .chk{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.set.open{background:var(--card2);border-radius:14px 14px 0 0}
.editor{background:var(--card2);border-radius:0 0 14px 14px;margin:0 0 6px;padding:4px 10px 12px;animation:slide .25s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.stp{display:flex;align-items:center;gap:8px;margin:6px 0}
.stp .lab{width:66px;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stp button{width:52px;height:46px;border-radius:13px;background:var(--card3);font-size:17px;font-weight:700;font-family:var(--num)}
.stp button:active{background:#33333c}
.stp input{flex:1;min-width:0;height:46px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:13px;font-family:var(--num);font-size:22px;font-weight:700;outline:none}
.stp input:focus{border-color:var(--acc)}
.rirs{display:flex;gap:6px;flex:1}
.rirs button{flex:1;width:auto;height:40px;border-radius:11px;background:var(--card3);font-size:14px;font-weight:700;font-family:var(--num);color:var(--mute)}
.rirs button.on{background:var(--text);color:var(--bg)}
.ex-f{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 2px}
.ex-f button{font-size:13px;font-weight:600;color:var(--mute);padding:8px 4px}
.note{font-size:13px;color:var(--mute);line-height:1.4;margin:0 2px 10px}
.done-card{text-align:center;padding:28px 20px;background:radial-gradient(100% 120% at 50% 0%,rgba(212,255,58,.14),transparent 60%),var(--card)}
.done-card .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:14px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:var(--card2);border-radius:14px;padding:12px 6px}
.stat .k{font-size:22px;font-weight:800;font-family:var(--num)}
.stat .l{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.burst{width:72px;height:72px;margin:0 auto;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;animation:burst .8s var(--ease)}
.burst svg{width:34px;height:34px;stroke:var(--ink);stroke-width:3.5;fill:none}
@keyframes burst{0%{transform:scale(.4);box-shadow:0 0 0 0 rgba(212,255,58,.6)}60%{transform:scale(1.08)}100%{transform:scale(1);box-shadow:0 0 0 28px rgba(212,255,58,0)}}
.metric{font-family:var(--num);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.metric small{font-size:15px;color:var(--mute);font-weight:600;margin-left:4px;letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.chart{width:100%;height:auto;display:block;margin-top:12px;overflow:visible}
.empty{padding:22px 10px;text-align:center;color:var(--dim);font-size:14px;line-height:1.45}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card3);color:var(--text)}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.hs::-webkit-scrollbar{display:none}
.hs button{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}
.hs button.on{background:var(--text);color:var(--bg)}
.list .li{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.field{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{flex:1;font-size:16px;font-weight:500}
.field label small{display:block;font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
.field input{width:110px;height:44px;background:var(--card2);border:1px solid transparent;border-radius:12px;text-align:right;padding:0 12px;font-family:var(--num);font-size:18px;font-weight:700;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:var(--acc)}
.field input::placeholder{color:var(--dim);font-weight:600}
.field .unit{width:32px;font-size:13px;color:var(--mute)}
.energy{display:flex;gap:6px}
.energy button{width:38px;height:38px;border-radius:11px;background:var(--card2);font-weight:700;font-family:var(--num);color:var(--mute)}
.energy button.on{background:var(--acc);color:var(--ink)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat div{aspect-ratio:1;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--dim);font-family:var(--num)}
.heat .hd{background:none;aspect-ratio:auto;height:14px}
.heat .rest{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat .done{background:var(--acc);color:var(--ink)}
.heat .miss{background:rgba(255,255,255,.04);color:#44444c}
.heat .today{box-shadow:inset 0 0 0 2px var(--text)}
.bar-row{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:14px}
.bar-row .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-row .b i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--card3);min-height:4px}
.bar-row .b i.on{background:linear-gradient(180deg,#DFFF5E,#9BE22B)}
.bar-row .b span{font-size:11px;color:var(--dim);font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(var(--sab) + 8px);background:rgba(12,12,15,.78);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--dim);font-size:10.5px;font-weight:600;transition:color .2s}
.tab svg{width:25px;height:25px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--acc)}
.timer{position:fixed;left:50%;bottom:calc(var(--sab) + 86px);z-index:25;transform:translate(-50%,140%);opacity:0;pointer-events:none;transition:transform .45s var(--ease),opacity .3s;width:min(92vw,420px)}
.timer.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.timer .in{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-radius:24px;background:rgba(30,30,36,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line2);box-shadow:0 18px 50px -12px rgba(0,0,0,.8);transition:background .3s,color .3s}
.timer .tr{width:46px;height:46px;position:relative;flex:none}
.timer .tr svg{transform:rotate(-90deg)}
.timer .t{font-family:var(--num);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.timer .lbl{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tb{width:44px;height:44px;border-radius:14px;background:var(--card3);font-weight:700;font-size:13px;font-family:var(--num);flex:none}
.timer.end .in{background:rgba(212,255,58,.96);color:var(--ink)}
.timer.end .lbl{color:rgba(0,0,0,.6)}
.timer.end .tb{background:rgba(0,0,0,.12)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;transform:translateY(105%);transition:transform .42s var(--ease);max-height:88vh;overflow:auto;background:#17171C;border-radius:28px 28px 0 0;padding:10px 20px calc(var(--sab) + 22px);max-width:560px;margin:0 auto;border-top:1px solid var(--line2)}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--card3);margin:0 auto 14px}
.sheet h2{margin-bottom:14px}
.mile{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 12px}
.mile input{width:100px;height:72px;background:var(--card2);border:1px solid transparent;border-radius:18px;outline:none;font-family:var(--num);font-size:44px;font-weight:800;text-align:center}
.mile input:focus{border-color:var(--acc)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,calc(-100% - var(--sat) - 24px));opacity:0;visibility:hidden;z-index:60;padding:12px 18px;border-radius:999px;background:rgba(36,36,43,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:14px;font-weight:600;transition:transform .5s var(--ease),opacity .3s,visibility 0s .5s;border:1px solid var(--line2);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .5s var(--ease),opacity .2s,visibility 0s}
.coach{background:radial-gradient(120% 140% at 100% 0%,rgba(212,255,58,.10),transparent 55%),var(--card);border-color:rgba(212,255,58,.22)}
.coach.sent{background:var(--card);border-color:var(--line)}
.cdot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(212,255,58,.12);color:var(--acc);flex:none}
.cdot svg{width:20px;height:20px}.cdot.ok{background:rgba(212,255,58,.16)}
.chip-coach{display:inline-flex;align-items:center;gap:7px;margin:0 2px 12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--mute);font-size:13px;padding:7px 12px;min-height:34px}
.chip-coach svg{width:15px;height:15px;color:var(--acc)}
.coach-pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mute);max-height:34vh;overflow:auto}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.toast.sticky{cursor:pointer;border-color:rgba(212,255,58,.35);color:var(--acc)}
.toast.pr{border-color:rgba(255,179,64,.4);color:var(--pr)}
.fade{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mini{display:flex;gap:18px;margin-top:10px}
.mini div{font-size:12px;color:var(--mute)}
.mini b{display:block;font-family:var(--num);font-size:17px;color:var(--text);margin-top:2px}
.edit-ex{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.edit-ex:last-child{border-bottom:0}
.ib{width:36px;height:36px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px;flex:none}
.tf{width:100%;height:48px;background:var(--card2);border:1px solid transparent;border-radius:13px;padding:0 14px;font-size:16px;outline:none;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.tf:focus{border-color:var(--acc)}
.fl{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:6px 2px 6px;display:block}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tgl{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:16px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--card3);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw.on{background:var(--acc2)}
.sw.on::after{transform:translateX(20px)}
</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="timer" id="timer"><div class="in">
  <div class="tr"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="rgba(128,128,128,.25)" stroke-width="5"/><circle id="tring" cx="23" cy="23" r="19" fill="none" stroke="#D4FF3A" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="0"/></svg></div>
  <div class="grow"><div class="t num" id="tt">2:30</div><div class="lbl" id="tl">Rest</div></div>
  <button class="tb" data-act="t-15">−15</button>
  <button class="tb" data-act="t+15">+15</button>
  <button class="tb" data-act="t-skip" aria-label="Dismiss timer">✕</button>
</div></div>
<div class="scrim" id="scrim" data-act="close-sheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* Recomp — personal training tracker. All data stays on this device. */
const KEY = 'recomp.v1';
/* Coach protein target (Oct 2026). A saved settings.protein overrides it; null = use this. */
const PROTEIN_TARGET = 170, PROTEIN_RANGE = '160–185';

/* v1/v2 → v3: install the master plan, keep every log */
function migrate(d){
  if(!d || typeof d!=='object') return freshState();
  const f=freshState(), v=+d.version||1;
  const out=Object.assign({}, f, d);
  out.settings=Object.assign({}, f.settings, d.settings||{});
  for(const k of ['sessions','pt','runs','checkins','readiness']) out[k]=(d[k]&&typeof d[k]==='object')?d[k]:{};
  out.prs=Array.isArray(d.prs)?d.prs:[];
  if(v<SCHEMA || !d.program || !Array.isArray(d.program.blocks)){
    if(d.program && !Array.isArray(d.program.blocks)) out.legacyProgram=d.program;
    out.program=defaultProgram();
    if(v<SCHEMA){ out.migratedFrom=v; out.migratedAt=Date.now(); }
  }
  out.version=SCHEMA;
  return out;
}

const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pkey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (k,n) => { const d=pkey(k); d.setDate(d.getDate()+n); return dkey(d); };

const mondayOf = k => addD(k, -((pkey(k).getDay()+6)%7));

function allExercises(){

  for(const b of S.program.blocks){
    for(const d of [1,2,3,4,5,6,0]) for(const e of (b.days[d]?.exercises||[])) add(e);
    if(b.alt) for(const t of ['fbA','fbB']) for(const e of b.alt[t].exercises) add(e);
    if(b.opt) for(const e of b.opt.exercises) add(e);

function hist(id, exceptK){ // newest first
  const out=[];
  for(const [k,s] of Object.entries(S.sessions)){
    if(k===exceptK) continue;
    const e=s.ex&&s.ex[id]; if(!e) continue;
    const sets=e.sets.filter(x=>x&&x.done); if(sets.length) out.push({k,sets});
  }
  return out.sort((a,b)=>a.k<b.k?1:-1);
}
const e1rm = (w,r) => r>0 ? w*(1+r/30) : 0; // Epley
function avgWeight(k){
  const v=[]; for(let i=0;i<7;i++){ const c=S.checkins[addD(k,-i)]; if(c&&c.weight) v.push(+c.weight); }
  return v.length ? {avg:v.reduce((a,b)=>a+b,0)/v.length, n:v.length} : null;
}
function setScore(ex,s){
  if(ex.kind==='db') return e1rm(s.w,s.r);
  if(ex.kind==='hold') return s.r;
  return (s.w||0)*1000 + s.r; // bodyweight: more added load wins, then reps
}

/* double progression */
const padTo=(a,n)=>{ a=a.slice(); while(a.length<n) a.push(a[a.length-1]||0); return a.slice(0,n); };
const loadTxt=(ex,w)=> ex.kind==='db' ? `${w} lb` : ex.kind==='hold' ? 'BW' : (w>0?`BW+${w}`:'BW');
const repU=ex=> ex.kind==='hold' ? 's' : (ex.side ? '/side' : 'reps');
function suggest(ex,k){
  if(ex.sub) return subTarget(ex,k);
  const H=hist(ex.id,k), last=H.find(h=>h.k<k)||H[0], n=ex.sets;
  if(!last){
    const w = ex.kind==='db' ? (ex.start||20) : 0;
    const r = ex.amrap ? 10 : ex.min;
    return {first:true, w, reps:Array(n).fill(r), kind:'first',
      text: ex.kind==='db' ? `First time — starting load is a guess. Adjust to one you could do 2–3 more reps with.` : ex.kind==='hold' ? `First time — ${ex.min}s, clean form.` : `First time — leave 2–3 reps in the tank.`};
  }
  const ls=last.sets, w=ls[0].w||0, reps=ls.map(s=>s.r);
  const summary = `${loadTxt(ex,w)} × ${reps.join(' · ')}`;
  if(ex.amrap){
    const tot=reps.reduce((a,b)=>a+b,0), tgt=padTo(reps,n); tgt[tgt.length-1]++;
    return {w, reps:tgt, kind:'beat', text:`Beat <b>${tot} total reps</b> · last ${reps.join(' · ')}`, last:summary};
  }
  const hitTop = ls.length>=n && ls.every(s=>s.r>=ex.max) && !ls.some(s=>s.rir===0);
  if(hitTop){
    if(ex.kind==='hold') return {w, reps:Array(n).fill(ex.max+10), kind:'up', text:`Every set hit ${ex.max}s — go <b>${ex.max+10}s</b> today`, last:summary};
    if(ex.kind==='db'){
      if(w+DB_STEP<=DB_MAX) return {w:w+DB_STEP, reps:Array(n).fill(ex.min), kind:'up', text:`Top of the range last time — move up to <b>${w+DB_STEP} lb</b>, reps back to ${ex.min}. Only if form held.`, last:summary};
      return {w, reps:Array(n).fill(ex.max+1), kind:'maxed', text:`Maxed at ${DB_MAX} lb — use a 3-second lowering${ex.side?'':' or switch to single-arm/leg'} and chase <b>${ex.max+1}+</b>`, last:summary};
    }
    const nw = w>0 ? w+DB_STEP : 10;
    return {w:nw, reps:Array(n).fill(ex.min), kind:'up', text: w>0 ? `Top of the range — add load: <b>BW+${nw} lb</b>` : `Top of the range — add a backpack (~<b>10 lb</b>) or a harder variation`, last:summary};
  }
  const tgt=padTo(reps,n), i=tgt.findIndex(r=>r<ex.max); if(i>=0) tgt[i]++;
  return {w, reps:tgt, kind:'beat', text:`Beat last time: <b>${loadTxt(ex,w)} × ${tgt.join(' · ')}</b>`, last:summary};
}
function setVal(ex,k,i,sg){ const st=exState(k,ex.id).sets[i]; if(st) return st; return {w:sg.w, r:sg.reps[i]??sg.reps[sg.reps.length-1], rir:null, done:false}; }
function checkPR(ex,k,s){
  if(ex.sub) return false;
  const H=hist(ex.id,k); if(!H.length) return false;
  const best=Math.max(...H.flatMap(h=>h.sets.map(x=>setScore(ex,x))));
  const sameDay=exState(k,ex.id).sets.filter(x=>x&&x.done&&x!==s).map(x=>setScore(ex,x));
  const sc=setScore(ex,s);
  if(sc>best+1e-9 && sc>Math.max(0,...sameDay)){ S.prs.unshift({k,id:ex.id,name:ex.name,w:s.w,r:s.r,kind:ex.kind}); S.prs=S.prs.slice(0,60); return true; }
  return false;
}

function scaleRun(r, f){ if(!r) return r; r.min=Math.max(10,Math.round(r.min*f)); r.max=Math.max(r.min,Math.round(r.max*f)); if(r.reps) r.reps = Array.isArray(r.reps) ? r.reps.map(x=>Math.max(2,Math.round(x*f))) : Math.max(2,Math.round(r.reps*f)); return r; }
function easyRun(r){ return Object.assign(r, {kind:'easy', from:r.kind}); }
function planFor(k){
  const st=S.settings, {b,i,before}=blockAt(k), dow=pkey(k).getDay();
  const week = before ? 1 : Math.floor(diffD(k,b.start)/7)+1;
  const {slot,tpl,altNote} = slotTpl(b,dow,week);
  const p = Object.assign({exercises:[]}, clone(tpl));
  Object.assign(p, {k, dow, slot, bi:i, block:b, week, weeks:blockWeeks(b), before, altNote:!!altNote, rirText:b.rir, flags:[], banners:[]});
  p.exercises = p.exercises||[];
  for(const e of p.exercises){ const o=e.byWeek&&e.byWeek[week]; if(o){ e.min=o[0]; e.max=o[1]; } }
  if(p.run && p.run.byWeek){ const v=p.run.byWeek[Math.min(week,p.run.byWeek.length)-1]; p.run.min=p.run.max=v; }
  if(p.optRun && k>=p.optRun.from) p.extraRun = {min:p.optRun.min, max:p.optRun.max, kind:'easy'};
  /* mock tests and the real test */
  const T=st.testDate;
  if(T && k===T){
    Object.assign(p, {title:'Hiring test', type:'mock', test:true, tag:'Push-ups · sit-ups · 1.5 mi', exercises:[], run:null, pt:'max', opt:false, extraRun:null});
  } else if(mockDates().includes(k)){
    Object.assign(p, {title:'Mock test', type:'mock', tag:'Push-ups · sit-ups · 1.5 mi', exercises:[], run:null, pt:'max', opt:false, extraRun:null});
  }
  /* gated hard runs */
  if(p.run && (p.run.kind==='intervals'||p.run.kind==='400s') && st.intervalsOK!==true){ p.gate=p.run.kind; p.run.kind = p.run.kind==='400s' ? 'strides' : 'easy'; p.run.from=p.gate; if(p.run.max>33 && p.gate==='400s'){ p.run.min=25; p.run.max=33; } }
  /* deload */
  const inDeload = b.deload && k>=b.deload[0] && k<=b.deload[1];
  if(inDeload){
    p.deload=true; p.flags.push('Deload'); p.rirText='3–4 RIR · easy week';
    for(const e of p.exercises) e.sets=Math.max(1,Math.ceil(e.sets/2));
    if(p.run){ scaleRun(p.run,0.7); if(p.run.kind!=='easy'&&p.run.kind!=='long') easyRun(p.run); }
    if(p.pt==='max') p.pt=null;
    if(p.type==='mock' && !p.test){ p.type='run'; p.title='Easy Run'; p.tag='Deload · no tests'; p.run={min:20,max:25,kind:'easy'}; }
    p.opt=false;
    p.banners.push('Deload week — half the sets, 3–4 reps in reserve, runs ~30% shorter, no max tests.'+(b.deloadNote?' '+b.deloadNote:''));
  }
  /* taper before a confirmed test, and the last week before the academy */
  const taperDays = T ? diffD(T,k) : null;
  const A=st.academyStart, acadDays = A ? diffD(A,k) : null;
  const tapering = taperDays!==null && taperDays>=1 && taperDays<=7;
  const finalWk = acadDays!==null && acadDays>=1 && acadDays<=7;
  if((tapering||finalWk) && p.type!=='mock'){
    p.taper=true; p.flags.push(tapering?'Taper':'Final week');
    for(const e of p.exercises) e.sets=Math.max(1,Math.round(e.sets*0.5));
    if(p.run) scaleRun(p.run,0.5);
    if(p.pt==='max') p.pt=null;
    p.opt=false;
    p.banners.push(tapering ? `Taper · test in ${taperDays} day${taperDays===1?'':'s'} — volume about half, keep the intensity.` : `Academy in ${acadDays} day${acadDays===1?'':'s'} — volume −50%. Arrive fresh.`);
  }
  if(b.banner) p.banners.push(b.banner);
  /* readiness: slept under 6 h */
  if(S.readiness && S.readiness[k] && S.readiness[k].low && p.type!=='rest'){
    p.lowSleep=true; p.flags.push('Low sleep');
    if(p.type==='mock'){
      p.movedMock=true; p.type='run'; p.title='Easy run + PT submax'; p.tag='Mock moved — slept under 6 h';
      p.run={min:20,max:25,kind:'easy'}; p.pt=null; p.exercises=SUB(4,0.6,0.75);
    } else {
      for(const e of p.exercises) e.sets=Math.max(1,e.sets-1);
      if(p.pt==='max'){ p.pt=null; p.exercises.push(...SUB(4,0.6,0.75).map(e=>(e.sets=3,e))); }
    }
    if(p.run && p.run.kind!=='easy' && p.run.kind!=='long') easyRun(p.run);
    p.rirText = p.rirText + ' · +1 RIR today';
    p.banners.unshift(p.movedMock ? 'Slept under 6 h — no mock today. Easy run plus submax instead; move the mock to your next good-sleep day.' : 'Slept under 6 h — no max tests, one set fewer per exercise, +1 rep in reserve. Easy running is fine.');
  }
  /* optional Upper C (B2/B3 Thursday) */
  if(p.opt && b.opt && !p.lowSleep){
    const n=liftDoneB1();
    if(n>=UPPER_C_NEED){ p.optional=clone(b.opt); }
    else p.optLocked={n, need:UPPER_C_NEED};
  }
  /* keep the title/tag honest after modifiers */
  if(p.type!=='mock'){
    const hasSub=p.exercises.some(e=>e.sub);
    if(p.pt!=='max' && p.title) p.title=p.title.replace(/ \+ PT max/, hasSub?' + PT submax':'');
    if(p.gate && p.title) p.title=p.title.replace(/^(Intervals|400s)/,'Run');
    if(p.title==='Run') p.title='Easy run';
    if(p.tag){
      const rk=p.run?p.run.kind:null, T={intervals:/^intervals/i, '400s':/400/i, strides:/strides/i, tempo:/^tempo/i};
      let t=p.tag.split(' · ').filter(x=>{ for(const kd in T) if(T[kd].test(x) && rk!==kd) return false; return true; });
      t=t.map(x=>/^PT max$/.test(x)&&p.pt!=='max' ? (hasSub?'PT submax':'') : x).filter(Boolean);
      if(p.run && p.tag!==t.join(' · ') && !t.some(x=>/run|strides|tempo|interval|400/i.test(x))) t.unshift(rk==='strides'?'Easy run · strides':'Easy run');
      p.tag=t.join(' · ');
      if(p.tag.toLowerCase()===String(p.title).toLowerCase()) p.tag='Conversational pace';
    }
  }
  if(before) p.banners.unshift(`${blockLabel(b)} starts ${fmtD(b.start)}.`);
  return p;
}

function subTarget(ex,k){
  const f=ex.sub.f, lo=ex.sub.lo||0.6, hi=ex.sub.hi||0.75, n=ex.sets;
  const maxE = Object.keys(S.pt).filter(d=>d<k && S.pt[d] && S.pt[d][f]>0).sort().pop();
  if(!maxE) return {first:true, w:0, reps:Array(n).fill(10), kind:'first', text:`No max logged yet — 10 reps as a placeholder. Log a max test to get real targets.`};
  const max=+S.pt[maxE][f], loR=Math.max(1,Math.round(max*lo)), hiR=Math.max(loR,Math.round(max*hi));
  const H=hist(ex.id,k).filter(h=>h.k<k && diffD(k,h.k)>=6);
  let t=loR, why=`${Math.round(lo*100)}% of your ${max} max (${fmtShort(maxE)})`;
  if(H.length){ const prev=Math.min(...H[0].sets.map(s=>s.r)); if(prev+1>t){ t=prev+1; why=`last week ${prev}/set + 1`; } }
  if(t>hiR){ t=hiR; why=`capped at ${Math.round(hi*100)}% of your ${max} max`; }
  return {w:0, reps:Array(n).fill(t), kind:'sub', max, target:t, text:`${n} × <b>${t}</b> · ${why} · 60 s rest`};
}

  const R=p.run, r=S.runs[k], m=r&&r.min?r.min:Math.round((R.min+R.max)/2), t=RUN_TXT[R.kind]||RUN_TXT.easy;
  const reps = Array.isArray(R.reps)?R.reps.join('–'):R.reps;
  let d=t[1].replace('{r}',reps||6); if(R.kind==='400s'){ const g=goalPace(); d+= g?` · ≈${g} per 400 m from your best 1.5 mi`:' · pace from your Nov 3 baseline'; }
  const len = R.min===R.max?`${R.min} min`:`${R.min}–${R.max} min`;
  return `<div class="card ex"><div class="ex-h"><div class="grow"><div class="ex-n">${title||t[0]}${R.after?' · after lifting':''}</div><div class="ex-p">${len} · ${d}${R.from==='intervals'||R.from==='400s'?' · easy today':''}</div></div>${r&&r.min?'<span class="pill acc">Logged</span>':''}</div>
  <div class="stp"><span class="lab">Minutes</span><button data-act="run-adj" data-d="-5">−5</button><input class="num" inputmode="numeric" id="runMin" value="${m}"><button data-act="run-adj" data-d="5">+5</button></div>
  <div style="height:8px"></div><button class="btn ${r&&r.min?'ghost':'acc'}" data-act="run-save">${r&&r.min?'Update run':'Log run'}</button></div>`;
}
function bestMile(exceptK){ const v=Object.entries(S.runs).filter(([k,r])=>r.sec&&k!==exceptK).map(([,r])=>r.sec); return v.length?Math.min(...v):null; }
function timedCard(k){
  const r=S.runs[k], best=bestMile(k);
  return `<div class="card ex"><div class="ex-h"><div class="grow"><div class="ex-n">1.5-mile time</div><div class="ex-p">${best?`Your best: ${mmss(best)}`:'Your first one sets the baseline'}</div></div>${r&&r.sec?'<span class="pill acc">Logged</span>':''}</div>
  <div class="mile"><input class="num" inputmode="numeric" id="mileM" value="${r&&r.sec?Math.floor(r.sec/60):''}" placeholder="m" aria-label="Minutes"><span class="metric" style="color:var(--dim)">:</span><input class="num" inputmode="numeric" id="mileS" value="${r&&r.sec?pad(r.sec%60):''}" placeholder="ss" aria-label="Seconds"></div>
  <button class="btn ${r&&r.sec?'ghost':'acc'}" data-act="mile-save">${r&&r.sec?'Update time':'Log time'}</button></div>`;
}
function lastPT(k){ const ks=Object.keys(S.pt).filter(x=>x<k).sort(); return ks.length?S.pt[ks[ks.length-1]]:null; }
function ptCard(k,p){
  const mock=p&&p.type==='mock', base=p&&p.block&&p.block.n===1;
  const e=S.pt[k], l=lastPT(k), pu=e?e.push:(l?l.push:20), su=e?e.sit:(l?l.sit:25);
  return `<div class="card ex"><div class="ex-h"><div class="grow"><div class="ex-n">${mock?'Push-ups &amp; sit-ups':base?'PT practice · baseline':'PT max test'}</div><div class="ex-p">60 s max strict push-ups · 3 min rest · 60 s max strict sit-ups${mock?' · then 5 min rest':''}</div></div>${e?'<span class="pill acc">Logged</span>':''}</div>
  ${l?`<div class="target"><span class="ic">↗</span><span>Last: <b>${l.push} push-ups · ${l.sit} sit-ups</b></span></div>`:''}
  <div class="stp"><span class="lab">Push-ups</span><button data-act="pt-adj" data-f="push" data-d="-1">−1</button><input class="num" inputmode="numeric" id="ptPush" value="${pu}"><button data-act="pt-adj" data-f="push" data-d="1">+1</button></div>
  <div class="stp"><span class="lab">Sit-ups</span><button data-act="pt-adj" data-f="sit" data-d="-1">−1</button><input class="num" inputmode="numeric" id="ptSit" value="${su}"><button data-act="pt-adj" data-f="sit" data-d="1">+1</button></div>
  <div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost" data-act="pt-timer"${mock?' data-v="mock"':''} style="flex:1">Run test timer</button><button class="btn ${e?'ghost':'acc'}" data-act="pt-save" style="flex:1">${e?'Update':'Log PT'}</button></div>
  <p class="tiny" style="margin:8px 2px 0">The timer runs 60 s → 3 min rest → 60 s${mock?' → 5 min rest':''}, with a chime at each switch.</p></div>`;
}
function doneCard(k,p){
  const s=S.sessions[k]; let vol=0, sets=0; const prs=S.prs.filter(x=>x.k===k).length;
  for(const ex of planExercises(p,k)){ const st=s.ex[ex.id]; if(!st) continue; for(const x of st.sets) if(x&&x.done){ sets++; if(ex.kind==='db') vol+=x.w*x.r; } }
  const r=S.runs[k], pt=S.pt[k], n=streak();
  const a = r ? (r.sec?['1.5 mi',mmss(r.sec)]:['Minutes',r.min]) : ['Sets',sets];
  const b = pt ? ['Push-ups',pt.push] : ['Volume', vol>=1000?(vol/1000).toFixed(1)+'k':vol];
  const c = pt && p.type!=='lift' && p.pt ? ['Sit-ups',pt.sit] : ['PRs',prs];
  const nx=nextTraining(k);
  return `<div class="card done-card"><div class="burst">${I.check}</div><div class="big">${esc(p.title)} done</div><div class="sub">${n>1?`${n} planned sessions in a row.`:'Logged. That one counts.'}</div>
  <div class="stats"><div class="stat"><div class="k">${a[1]}</div><div class="l">${a[0]}</div></div><div class="stat"><div class="k">${b[1]}</div><div class="l">${b[0]}</div></div><div class="stat"><div class="k" style="${c[0]==='PRs'&&c[1]?'color:var(--pr)':''}">${c[1]}</div><div class="l">${c[0]}</div></div></div>
  <div style="height:14px"></div><button class="btn ghost" data-act="reopen">Edit session</button></div>`
  + coachCard(k) + (nx?`<div class="card"><h3>Up next</h3><div class="ex-n">${esc(nx.p.title)}</div><div class="ex-p">${fmtD(nx.k)} · ${esc(nx.p.tag||'')}</div></div>`:'') + bodyQuick(k);
}
function bodyQuick(k){
  const c=S.checkins[k]||{}, a=avgWeight(k);
  return `<div class="card"><div class="row between"><h3 style="margin:0">Daily check-in</h3><button class="link" data-act="tab" data-v="body">Open</button></div>
  <div class="mini"><div>7-day avg<b>${a?a.avg.toFixed(1)+' lb':'—'}</b></div><div>Protein<b>${c.protein?c.protein+' g':'—'}</b></div><div>Sleep<b>${c.sleep?c.sleep+' h':'—'}</b></div></div></div>`;
}
/* ---------- PT ---------- */
function ptTile(label,f,last){
  const v=last?last[f]:null, std=PT_STD[f], buf=PT_BUF[f], p=v==null?0:Math.min(1,v/buf);
  const st = v==null ? 'No entries yet' : v>=buf ? 'Buffer cleared' : v>=std ? `${buf-v} to buffer` : `${std-v} to standard`;
  const col = v==null ? 'var(--dim)' : v>=buf ? 'var(--acc)' : v>=std ? 'var(--blue)' : 'var(--mute)';
  return tile(label,`<div class="row between" style="margin-top:8px"><div class="metric">${v??'—'}</div><div class="ring" style="width:46px;height:46px">${ringSVG(p,46,5,v!=null&&v>=std?'#D4FF3A':'#64D2FF')}</div></div><div style="font-size:13px;font-weight:600;margin-top:8px;color:${col}">${st}</div><div class="tiny" style="margin-top:2px">Standard ${std} · buffer ${buf}</div>`);
}
function vPT(){
  const ks=Object.keys(S.pt).sort(), last=ks.length?S.pt[ks[ks.length-1]]:null, seg=UI.ptSeg;
  let h=`<div class="hdr"><div><div class="eyebrow">Academy fitness test</div><h1>PT Test</h1></div><button class="link" data-act="pt-new">+ Log</button></div>`;
  h+=`<div class="grid2">${ptTile('Push-ups · 60 s','push',last)}${ptTile('Sit-ups · 60 s','sit',last)}</div>`;
  h+=`<div class="card" style="margin-top:12px"><div class="seg">${[['push','Push-ups'],['sit','Sit-ups'],['mile','1.5 mile']].map(([v,l])=>`<button class="${seg===v?'on':''}" data-act="ptseg" data-v="${v}">${l}</button>`).join('')}</div>`;
  if(seg==='mile'){
    const pts=Object.entries(S.runs).filter(([,r])=>r.sec).sort().map(([k,r])=>({x:pkey(k).getTime(),y:r.sec}));
    if(pts.length){ const b=Math.min(...pts.map(p=>p.y)); h+=`<div class="row between" style="margin-top:14px"><div><div class="tiny">Latest</div><div class="metric">${mmss(pts[pts.length-1].y)}</div></div><div style="text-align:right"><div class="tiny">Best</div><div class="metric" style="font-size:30px;color:var(--acc)">${mmss(b)}</div></div></div>`; }
    h+= pts.length ? chart({series:[{pts,color:'#64D2FF',area:true}],invert:true,yFmt:mmss}) : `<div class="empty">Your first timed 1.5-mile is the mock test on ${fmtD(S.program.mocks[0])}.<br>Log it there and the trend starts here.</div>`;
    h+=`<p class="tiny" style="margin:10px 2px 0">Higher on the chart = faster. This tracks only your own times.</p>`;
  } else {
    const std=PT_STD[seg], buf=PT_BUF[seg];
    const pts=ks.map(k=>({x:pkey(k).getTime(),y:S.pt[k][seg]})).filter(p=>p.y!=null);
    h+= pts.length ? chart({series:[{pts,color:'#D4FF3A',area:true}],refs:[{y:std,label:`Standard ${std}`,color:'#9A9AA4'},{y:buf,label:`Buffer ${buf}`,color:'#D4FF3A',dash:true}],minY:0}) : `<div class="empty">Log a Tuesday or Saturday practice and your line shows up here against the ${std} standard and ${buf} buffer.</div>`;
  }
  h+=`</div><div class="sec"><h2>History</h2></div><div class="card list" style="padding-top:4px;padding-bottom:4px">`;
  const rows=[...ks.map(k=>({k,t:'pt'})),...Object.keys(S.runs).filter(k=>S.runs[k].sec).map(k=>({k,t:'mile'}))].sort((a,b)=>a.k<b.k?1:-1).slice(0,24);
  h+= rows.length ? rows.map(r=> r.t==='pt'
    ? `<div class="li"><div class="grow"><div style="font-weight:600" class="num">${S.pt[r.k].push} push-ups · ${S.pt[r.k].sit} sit-ups</div><div class="tiny">${fmtD(r.k)}</div></div><button class="ib" data-act="pt-del" data-v="${r.k}" aria-label="Delete">✕</button></div>`
    : `<div class="li"><div class="grow"><div style="font-weight:600" class="num">1.5 mi · ${mmss(S.runs[r.k].sec)}</div><div class="tiny">${fmtD(r.k)}</div></div><button class="ib" data-act="mile-del" data-v="${r.k}" aria-label="Delete">✕</button></div>`).join('') : `<div class="empty">No entries yet.</div>`;
  h+=`</div><p class="tiny" style="margin:4px 6px">Standard: 22 push-ups and 25 sit-ups, 60 s each. Buffers (30 / 35) are your own safety margin.</p>`;
  return h;
}

/* ---------- BODY ---------- */
function bodyDate(){ return UI.date>todayK()?todayK():UI.date; }
function vBody(){
  const k=bodyDate(), c=S.checkins[k]||{}, a=avgWeight(k), prev=avgWeight(addD(k,-7)), st=S.settings;
  let h=`<div class="hdr"><div><div class="eyebrow">Body & habits</div><h1>Check-in</h1></div></div>`;
  h+=`<div class="card hero"><div class="eyebrow">7-day average weight</div>`;
  if(a){
    const d=prev?a.avg-prev.avg:null;
    h+=`<div class="row between" style="align-items:flex-end;margin-top:8px"><div class="metric">${a.avg.toFixed(1)}<small>lb</small></div>${d!=null?`<span class="pill">${d>0.05?'+':d<-0.05?'−':'±'}${Math.abs(d).toFixed(1)} lb vs prior 7 days</span>`:''}</div><div class="tiny" style="margin-top:6px">${a.n} weigh-in${a.n>1?'s':''} in the last 7 days. Single readings swing with water and food; the average is the signal.</div>`;
  } else h+=`<div class="metric" style="margin-top:8px;color:var(--dim)">—</div><div class="tiny" style="margin-top:6px">Add a weigh-in below. The average gets reliable around 4–5 readings a week.</div>`;
  h+=weightChart(k)+`</div>`;
  h+=`<div class="sec"><h2>${k===todayK()?'Today':fmtD(k)}</h2><div class="row" style="gap:6px"><button class="ib" data-act="bday" data-v="-1" aria-label="Previous day">‹</button><button class="ib" data-act="bday" data-v="1" aria-label="Next day" ${k>=todayK()?'disabled style="opacity:.3"':''}>›</button></div></div>`;
  const F=(f,l,u,sub,mode='decimal')=>`<div class="field"><label for="ci-${f}">${l}${sub?`<small>${sub}</small>`:''}</label><input id="ci-${f}" class="num" inputmode="${mode}" data-ci="${f}" value="${c[f]??''}" placeholder="—"><span class="unit">${u}</span></div>`;
  h+=`<div class="card" style="padding:4px 16px">
    ${F('weight','Bodyweight','lb','Morning, before food')}
    ${F('waist','Waist','in','At the navel, relaxed')}
    ${F('cal','Calories','kcal',st.calories?`Target ${st.calories}`:'Provisional 2,550–2,650','numeric')}
    ${F('protein','Protein','g',st.protein?`Target ${st.protein} g`:`Target ~${PROTEIN_TARGET} g (${PROTEIN_RANGE})`,'numeric')}
    ${F('sleep','Sleep','h','Hours asleep')}
    <div class="field"><label>Energy<small>1 low · 5 high</small></label><div class="energy">${[1,2,3,4,5].map(x=>`<button class="${c.energy===x?'on':''}" data-act="energy" data-v="${x}">${x}</button>`).join('')}</div></div>
  </div>`;
  const pv=+c.protein||0, pT=st.protein||PROTEIN_TARGET;
  h+=`<div class="grid2">${tile('Protein',`<div class="row between" style="margin-top:8px"><div class="metric" style="font-size:32px">${pv||'—'}<small>/ ${st.protein||PROTEIN_TARGET} g</small></div><div class="ring" style="width:42px;height:42px">${ringSVG(pv/pT,42,5)}</div></div>`)}
  ${tile('Calories',`<div class="metric" style="font-size:32px;margin-top:8px">${c.cal||'—'}<small>/ ${st.calories||'2,550–2,650'}</small></div>${st.calories?'':'<div class="tiny" style="margin-top:6px">Provisional until Nov 16 calibration</div>'}`)}</div>`;
  h+=`<div class="sec"><h2>Trends</h2><span class="tiny">last 30 entries</span></div><div class="grid2">${miniTrend('Waist','waist','in')}${miniTrend('Sleep','sleep','h')}</div><div style="height:12px"></div><div class="grid2">${miniTrend('Protein','protein','g')}${miniTrend('Energy','energy','/5')}</div>`;
  return h;
}
function weightChart(k){
  const days=[]; for(let i=55;i>=0;i--) days.push(addD(k,-i));
  const raw=days.filter(d=>S.checkins[d]&&S.checkins[d].weight).map(d=>({x:pkey(d).getTime(),y:+S.checkins[d].weight}));
  if(raw.length<2) return '';
  const avg=days.filter(d=>pkey(d).getTime()>=raw[0].x).map(d=>{const a=avgWeight(d);return a?{x:pkey(d).getTime(),y:a.avg}:null}).filter(Boolean);
  return chart({series:[{pts:raw,color:'rgba(255,255,255,.30)',dotsOnly:true},{pts:avg,color:'#D4FF3A',area:true,noDots:true}],yFmt:v=>v.toFixed(0),pad:1})+`<div class="row" style="gap:14px;margin-top:8px"><span class="tiny"><span style="color:var(--acc)">━</span> 7-day average</span><span class="tiny"><span style="color:#888">●</span> single weigh-ins</span></div>`;
}
function miniTrend(l,f,u){
  const ks=Object.keys(S.checkins).filter(k=>S.checkins[k][f]!=null&&S.checkins[k][f]!=='').sort().slice(-30);
  const pts=ks.map(k=>({x:pkey(k).getTime(),y:+S.checkins[k][f]})), lv=pts.length?pts[pts.length-1].y:null;
  return tile(l,`<div class="metric" style="font-size:26px;margin-top:6px">${lv??'—'}<small>${lv!=null?u:''}</small></div>${pts.length>1?chart({series:[{pts,color:'#64D2FF'}],h:54,bare:true}):'<div class="tiny" style="margin-top:10px">Trend after 2 entries</div>'}`);
}

/* ---------- PROGRESS ---------- */
function vProgress(){
  const t=todayK(), P=S.program, n=streak(), m=mondayOf(t);
  let pl=0,dn=0; for(let i=0;i<7;i++){ const k=addD(m,i); if(isTraining(planFor(k))) pl++; if(dayDone(k)) dn++; }
  let h=`<div class="hdr"><div><div class="eyebrow">${blockLabel(blockAt(t).b)}</div><h1>Progress</h1></div></div>`;
  h+=`<div class="grid2">${tile('Streak',`<div class="metric" style="margin-top:8px">${n}<small>${n===1?'session':'sessions'}</small></div><div class="tiny" style="margin-top:6px">Planned days in a row</div>`)}
  ${tile('This week',`<div class="row between" style="margin-top:8px"><div class="metric">${dn}<small>/ ${pl}</small></div><div class="ring" style="width:42px;height:42px">${ringSVG(pl?dn/pl:0,42,5)}</div></div><div class="tiny" style="margin-top:6px">Sessions done vs planned</div>`)}</div>`;
  h+=`<div style="height:12px"></div>`+coachRow();
  const weeks=Math.max(2, Math.ceil((diffD(t,P.start)+1)/7)), w0=Math.max(0,weeks-6);
  h+=`<div class="card" style="margin-top:12px"><div class="row between"><h3 style="margin:0">Consistency</h3><span class="tiny">from ${fmtShort(addD(P.start,w0*7))}</span></div><div class="heat" style="margin-top:12px">${['M','T','W','T','F','S','S'].map(d=>`<div class="hd">${d}</div>`).join('')}`;
  for(let w=w0;w<weeks;w++) for(let i=0;i<7;i++){ const k=addD(P.start,w*7+i), s=S.sessions[k];
    const cl = dayDone(k) ? 'done' : !isTraining(planFor(k)) ? 'rest' : k<t ? 'miss' : '';
    h+=`<div class="${cl} ${k===t?'today':''}">${pkey(k).getDate()}</div>`; }
  h+=`</div></div>`;
  const byId=Object.fromEntries(allExercises().map(e=>[e.id,e])); const wv=[];
  for(let w=w0;w<weeks;w++){ let v=0; for(let i=0;i<7;i++){ const s=S.sessions[addD(P.start,w*7+i)]; if(!s) continue; for(const [id,e] of Object.entries(s.ex)) if(byId[id]&&byId[id].kind==='db') for(const x of e.sets) if(x&&x.done) v+=x.w*x.r; } wv.push({w:w+1,v}); }
  const mx=Math.max(1,...wv.map(x=>x.v));
  h+=`<div class="card"><div class="row between"><h3 style="margin:0">Dumbbell volume</h3><span class="tiny">lb × reps per week</span></div><div class="bar-row">${wv.map(x=>`<div class="b"><i class="${x.v?'on':''}" style="height:${Math.max(4,x.v/mx*68)}px"></i><span>W${x.w}</span></div>`).join('')}</div></div>`;
  const exs=allExercises().filter(e=>!e.sub); if(!UI.prog||!exs.find(e=>e.id===UI.prog)) UI.prog=(exs.find(e=>hist(e.id).length)||exs[0]||{}).id;
  const ex=exs.find(e=>e.id===UI.prog);
  h+=`<div class="sec"><h2>Lifts</h2></div><div class="hs">${exs.map(e=>`<button class="${e.id===UI.prog?'on':''}" data-act="prog" data-v="${e.id}">${esc(e.name)}</button>`).join('')}</div><div style="height:10px"></div>`;
  if(ex){
    const H=hist(ex.id).reverse();
    const metric = ex.kind==='db' ? 'Estimated 1-rep max · per DB' : ex.kind==='hold' ? 'Longest hold' : ex.amrap ? 'Total reps' : 'Best set';
    const pts=H.map(x=>{ let y; if(ex.kind==='db') y=Math.max(...x.sets.map(s=>e1rm(s.w,s.r))); else if(ex.kind==='hold') y=Math.max(...x.sets.map(s=>s.r)); else if(ex.amrap) y=x.sets.reduce((a,s)=>a+s.r,0); else y=Math.max(...x.sets.map(s=>s.r)); return {x:pkey(x.k).getTime(),y}; });
    const lab = ex.kind==='db'?'lb':ex.kind==='hold'?'s':'reps';
    h+=`<div class="card"><div class="tiny" style="font-weight:600;color:var(--mute)">${metric}</div>`;
    if(pts.length){ const L=pts[pts.length-1].y, F0=pts[0].y, d=Math.round(L-F0);
      h+=`<div class="row between" style="align-items:flex-end;margin-top:8px"><div class="metric">${Math.round(L)}<small>${lab}</small></div>${pts.length>1?`<span class="pill ${d>0?'acc':''}">${d>0?'+':''}${d} since ${fmtShort(H[0].k)}</span>`:''}</div>`;
      h+= pts.length>1 ? chart({series:[{pts,color:'#D4FF3A',area:true}],yFmt:v=>Math.round(v)}) : `<div class="tiny" style="margin-top:10px">One session logged — the trend line starts after the next one.</div>`;
      h+=`<div class="list" style="margin-top:8px">${H.slice(-4).reverse().map(x=>`<div class="li"><div class="grow"><div style="font-weight:600" class="num">${ex.kind==='hold'?'':loadTxt(ex,x.sets[0].w||0)+' × '}${x.sets.map(s=>s.r).join(' · ')}${ex.kind==='hold'?' s':''}</div><div class="tiny">${fmtD(x.k)}</div></div></div>`).join('')}</div>`;
      if(ex.kind==='db') h+=`<p class="tiny" style="margin:6px 2px 0">Epley estimate from your logged sets — useful for direction, not a number to test.</p>`;
    } else h+=`<div class="empty">No sets logged yet for ${esc(ex.name)}.</div>`;
    h+=`</div>`;
  }
  h+=`<div class="sec"><h2>Personal bests</h2></div><div class="card list" style="padding-top:4px;padding-bottom:4px">`;
  h+= S.prs.length ? S.prs.slice(0,12).map(p=>`<div class="li"><span class="pill pr">PR</span><div class="grow"><div style="font-weight:600">${esc(p.name)}</div><div class="tiny">${fmtD(p.k)}</div></div><div class="num" style="font-weight:700">${p.kind==='db'?p.w+' lb × ':p.kind==='hold'?'':(p.w>0?'BW+'+p.w+' × ':'')}${p.r}${p.kind==='hold'?' s':''}</div></div>`).join('') : `<div class="empty">Beat a previous best set and it lands here.</div>`;
  return h+`</div>`;
}

/* ---------- PLAN & SETTINGS ---------- */
const exLine = e => e.sub ? `${e.sets} sets · ${Math.round((e.sub.lo||.6)*100)}% of latest max · +1 rep/set weekly` : e.amrap?`${e.sets} sets · 1–2 short of failure`:e.kind==='hold'?`${e.sets} × ${e.min===e.max?e.min:e.min+'–'+e.max}s`:`${e.sets} × ${e.min===e.max?e.min:e.min+'–'+e.max}${e.side?' / side':''}`;

const fmtLong = k => { const d=pkey(k); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
function calib(endK){
  endK=endK||todayK(); const both=[], cals=[];
  for(let i=27;i>=0;i--){ const k=addD(endK,-i), c=S.checkins[k]; if(c&&c.cal>0){ cals.push(+c.cal); if(c.weight>0) both.push(k); } }
  if(both.length<14) return {ok:false, n:both.length};
  const a=both[0], z=both[both.length-1], mid=addD(a,6), span=diffD(z,mid);
  const w0=avgWeight(mid), w1=avgWeight(z);
  if(!w0||!w1||span<7) return {ok:false, n:both.length};
  const avgCal=cals.reduce((x,y)=>x+y,0)/cals.length, slope=(w1.avg-w0.avg)/span, maint=Math.round(avgCal - slope*3500);
  return {ok:true, n:both.length, avgCal:Math.round(avgCal), slope, perWk:slope*7, maint, lo:maint-350, hi:maint-250, mid:maint-300};
}

/* ---------- charts (inline SVG) ---------- */
function smooth(P){ if(P.length<2) return P.length?`M${P[0][0]},${P[0][1]}`:''; let d=`M${P[0][0]},${P[0][1]}`; for(let i=1;i<P.length;i++){ const [x0,y0]=P[i-1],[x1,y1]=P[i], cx=(x0+x1)/2; d+=` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; } return d; }
let chartN=0;
function chart(o){
  const W=342, H=o.h||170, bare=o.bare, pl=bare?3:34, pr=bare?3:10, pt=bare?5:14, pb=bare?5:24;
  const all=o.series.flatMap(s=>s.pts); if(!all.length) return '';
  const xs=all.map(p=>p.x), ys=all.map(p=>p.y).concat((o.refs||[]).map(r=>r.y));
  let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0){x0-=864e5*3;x1+=864e5*3;}
  let y0=Math.min(...ys), y1=Math.max(...ys); if(o.minY!=null) y0=Math.min(y0,o.minY);
  const span=(y1-y0)||Math.max(1,Math.abs(y1)*.1), py=o.pad??span*.12; y0-=py; y1+=py; if(o.minY!=null) y0=Math.max(o.minY,y0);
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr);
  const Y=y=>{ const f=(y-y0)/(y1-y0); return o.invert ? pt+f*(H-pt-pb) : H-pb-f*(H-pt-pb); };
  const fmt=o.yFmt||(v=>Math.round(v)); let g='';
  if(!bare){
    for(let i=0;i<=3;i++){ const v=y0+(y1-y0)*i/3, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.05)"/><text x="${pl-8}" y="${y+3.5}" text-anchor="end" font-size="10" fill="#5D5D67" font-family="-apple-system,system-ui">${fmt(v)}</text>`; }
    const nt=Math.min(4,new Set(xs).size||1);
    for(let i=0;i<nt;i++){ const x=nt===1?(x0+x1)/2:x0+(x1-x0)*i/(nt-1), d=new Date(x); g+=`<text x="${X(x)}" y="${H-6}" text-anchor="${nt>1&&i===0?'start':nt>1&&i===nt-1?'end':'middle'}" font-size="10" fill="#5D5D67" font-family="-apple-system,system-ui">${MON[d.getMonth()]} ${d.getDate()}</text>`; }
  }
  for(const r of (o.refs||[])){ const y=Y(r.y); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="${r.color}" stroke-opacity=".6" stroke-width="1.2" ${r.dash?'stroke-dasharray="4 4"':''}/><text x="${W-pr}" y="${y-5}" text-anchor="end" font-size="10" font-weight="600" fill="${r.color}" font-family="-apple-system,system-ui">${r.label}</text>`; }
  for(const s of o.series){
    const P=s.pts.slice().sort((a,b)=>a.x-b.x).map(p=>[+X(p.x).toFixed(1),+Y(p.y).toFixed(1)]);
    if(s.dotsOnly){ g+=P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="${s.color}"/>`).join(''); continue; }
    const d=smooth(P), id='cg'+(++chartN);
    if(s.area&&P.length>1) g+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${P[P.length-1][0]},${H-pb} L${P[0][0]},${H-pb} Z" fill="url(#${id})"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${bare?2:2.6}" stroke-linecap="round" stroke-linejoin="round"/>`;
    if(!bare) g+=P.map(([x,y],i)=> (s.noDots&&i!==P.length-1)?'':`<circle cx="${x}" cy="${y}" r="${i===P.length-1?4.5:3}" fill="${i===P.length-1?s.color:'#131317'}" stroke="${s.color}" stroke-width="2"/>`).join('');
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">${g}</svg>`;
}

const MAILTO_MAX=7000;
/* Destination is a user setting (settings.coachEmail), saved only on this phone. */
const EMAIL_RE=/^[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;
const validEmail=v=>EMAIL_RE.test(String(v||'').trim());
const coachTo=()=>{ const v=String((S.settings&&S.settings.coachEmail)||'').trim(); return validEmail(v)?v:''; };
const touched=(o,since)=>!!o && ((o.at||0)>since || (o.doneAt||0)>since || (o.ex && Object.values(o.ex).some(e=>e.sets.some(x=>x&&(x.t||0)>since))));
function dataKeys(){ return [...Object.keys(S.sessions),...Object.keys(S.pt),...Object.keys(S.runs),...Object.keys(S.checkins)].sort(); }
function coachRange(full){
  const t=todayK(), first=[S.program.start,...dataKeys()].sort()[0];
  if(full||!S.lastSentAt) return {from:first<t?first:t, to:t, since:0, full:true};
  // day after the last send, plus anything logged/edited after the send (caught via timestamps)
  return {from:addD(dkey(new Date(S.lastSentAt)),1), to:t, since:S.lastSentAt, full:false};

const inR=(k,o,R)=> (k>=R.from&&k<=R.to) || (R.since>0 && touched(o,R.since));
function unsentDone(){ // completed sessions not yet sent
  const since=S.lastSentAt||0;
  return Object.entries(S.sessions).filter(([,s])=>s.done&&(s.doneAt||0)>since).map(([k,s])=>({k,at:s.doneAt||0}));
}
function staleUnsent(){ return unsentDone().some(x=>x.at && Date.now()-x.at>864e5); }
function sentAfter(k){ const s=S.sessions[k]; return !!(s&&s.done&&S.lastSentAt&&S.lastSentAt>=(s.doneAt||0)); }

function coachPayload(R){
  const byId=Object.fromEntries(allExercises().map(e=>[e.id,e]));
  const days=[], sessions={}, pt={}, runs={}, checkins={};
  for(const [k,s] of Object.entries(S.sessions)){ if(!inR(k,s,R)) continue;
    const ex={}; for(const [id,e] of Object.entries(s.ex)){ const d=e.sets.filter(x=>x&&x.done).map(x=>x.rir!=null?[x.w||0,x.r,x.rir]:[x.w||0,x.r]); if(d.length) ex[id]=d; }
    if(s.done||Object.keys(ex).length) sessions[k]={done:!!s.done,ex}; }
  for(const [k,v] of Object.entries(S.pt)) if(inR(k,v,R)) pt[k]=[v.push,v.sit];
  for(const [k,v] of Object.entries(S.runs)) if(inR(k,v,R)){ const o={}; if(v.min) o.min=v.min; if(v.sec) o.mile=mmss(v.sec); runs[k]=o; }
  for(const [k,v] of Object.entries(S.checkins)) if(inR(k,v,R)){ const o={}; for(const f of ['weight','waist','cal','protein','sleep','energy']) if(v[f]!=null&&v[f]!=='') o[f]=v[f]; if(Object.keys(o).length) checkins[k]=o; }
  const d0=[R.from,...Object.keys(sessions),...Object.keys(runs)].sort()[0];
  for(let k=d0;k<=R.to;k=addD(k,1)){ const p=planFor(k); if(isTraining(p)) { const o={d:k,plan:p.title,type:p.type,b:p.block.n,w:p.week,done:dayDone(k)}; if(p.flags.length) o.flags=p.flags; if(p.type==='mock') o.mock=true; days.push(o); } }
  const used=new Set(Object.values(sessions).flatMap(s=>Object.keys(s.ex)));
  const ex=Object.fromEntries([...used].filter(id=>byId[id]).map(id=>{const e=byId[id]; return [id,`${e.name}|${e.kind}|${e.sets}x${e.min}-${e.max}${e.side?'/side':''}`];}));
  return {app:'recomp',v:3,sent:new Date().toISOString(),range:[R.from,R.to],full:R.full,block:coachBlock(),
    targets:{protein:S.settings.protein??PROTEIN_TARGET,proteinRange:'160-185',proteinSource:S.settings.protein?'user':'coach',calories:S.settings.calories,provisional:S.settings.calories?null:{calories:'2550-2650'}},dates:{testDate:S.settings.testDate,academyStart:S.settings.academyStart,intervalsOK:S.settings.intervalsOK},
    lowSleep:Object.keys(S.readiness||{}).filter(k=>k>=R.from&&k<=R.to&&S.readiness[k].low).sort(),fmt:{sets:'[lb,reps,rir?]; bw lb = added load; hold reps = seconds',pt:'[pushups,situps]'},
    ex,days,sessions,pt,runs,checkins};
}
function coachBlock(){ const p=planFor(todayK()), b=p.block; return {id:b.id,n:b.n,name:b.name,week:p.week,weeks:p.weeks,deload:!!p.deload,taper:!!p.taper,start:b.start,end:b.end}; }
const blockLine = B => `Block ${B.n} ${B.name} · Week ${B.week}${B.weeks?' of '+B.weeks:''}${B.deload?' · deload':''}${B.taper?' · taper':''}`;
function coachSummary(R,J){
  const t=todayK(), m=mondayOf(t); let pl=0,dn=0; for(let i=0;i<7;i++){ const k=addD(m,i); if(isTraining(planFor(k))) pl++; if(dayDone(k)) dn++; }
  const L=[`Recomp log · ${R.full?'full history':'since last send'} · ${fmtShort(R.from)}–${fmtShort(R.to)}`, blockLine(J.block),'',
    `This week: ${dn}/${pl} sessions done · streak ${streak()}`];
  const dd=J.days.filter(d=>d.d<=t);
  if(dd.length){ L.push('','Sessions:'); for(const d of dd){ const s=J.sessions[d.d], r=J.runs[d.d];
    let x=''; if(s&&Object.keys(s.ex).length) x=' — '+Object.entries(s.ex).map(([id,st])=>`${(J.ex[id]||id).split('|')[0]} ${st.map(a=>(a[0]?a[0]+'×':'')+a[1]).join(',')}`).join('; ');
    if(r) x+=(x?' · ':' — ')+(r.mile?`1.5 mi ${r.mile}`:'')+(r.mile&&r.min?', ':'')+(r.min?`${r.min} min`:'');
    L.push(`${d.done?'✓':d.d===t?'·':'✗'} ${fmtD(d.d)} ${d.plan}${d.flags?' ('+d.flags.join(', ').toLowerCase()+')':''}${x}`); } }
  const pk=Object.keys(J.pt).sort(); if(pk.length){ L.push('','PT max tests (std 22/25 · buffer 30/35):'); for(const k of pk) L.push(`${fmtShort(k)}: ${J.pt[k][0]} push-ups · ${J.pt[k][1]} sit-ups`); }
  const mk=Object.keys(J.runs).filter(k=>J.runs[k].mile).sort(); if(mk.length){ L.push('','1.5 mi:'); for(const k of mk) L.push(`${fmtShort(k)}: ${J.runs[k].mile}`); }
  const ck=Object.keys(J.checkins).sort();
  if(ck.length){ const a=avgWeight(t); L.push('','Body:'); if(a) L.push(`7-day avg weight ${a.avg.toFixed(1)} lb (${a.n} weigh-ins)`);

function chime(){
  if(S.settings.haptics && navigator.vibrate) navigator.vibrate([180,90,180]);
  if(!S.settings.sound||!actx) return;
  try{ const t=actx.currentTime; [0,.18].forEach((o,i)=>{ const os=actx.createOscillator(), g=actx.createGain(); os.type='sine'; os.frequency.value=i?1046.5:784; g.gain.setValueAtTime(0.0001,t+o); g.gain.exponentialRampToValueAtTime(.25,t+o+.02); g.gain.exponentialRampToValueAtTime(.0001,t+o+.5); os.connect(g); g.connect(actx.destination); os.start(t+o); os.stop(t+o+.55); }); }catch(e){}
}
function startTimer(sec,label,next){
  T.dur=sec; T.end=Date.now()+sec*1000; T.label=label; T.next=next||null; T.ended=false;
  const el=document.getElementById('timer'); el.classList.add('show'); el.classList.remove('end');
  clearInterval(T.iv); T.iv=setInterval(tick,250); tick();
  if('wakeLock' in navigator && !wake) navigator.wakeLock.request('screen').then(w=>{wake=w; w.addEventListener('release',()=>{wake=null;});}).catch(()=>{});
}
function tick(){
  const left=(T.end-Date.now())/1000, el=document.getElementById('timer');
  document.getElementById('tt').textContent = left>0 ? mmss(Math.ceil(left)) : 'Go';
  document.getElementById('tl').textContent = left>0 ? T.label : (T.next?'Next: '+T.next.label:'Rest done — next set');
  document.getElementById('tring').setAttribute('stroke-dashoffset', String(119.4*(1-Math.max(0,left)/T.dur)));
  document.getElementById('tring').setAttribute('stroke', left>0?'#D4FF3A':'#0B0C06');
  if(left<=0 && !T.ended){ T.ended=true; el.classList.add('end'); chime();

}

      const up=prev&&(pu>prev.push||su>prev.sit); toast(up?`Up from last time${pu>prev.push?` · +${pu-prev.push} push-ups`:''}${su>prev.sit?` · +${su-prev.sit} sit-ups`:''}`:'PT practice logged', up?'pr':''); render(); break; }
    case 'pt-new': ptSheet(); break;
    case 'pt-sheet-save': { const k=document.getElementById('p-date').value||todayK(), pu=num('p-push'), su=num('p-sit'), mi=(document.getElementById('p-mile').value||'').trim();
      if(mi){ const mm=mi.match(/^(\d{1,2}):(\d{2})$/); if(!mm||+mm[2]>59){toast('Time format is m:ss');break;} S.runs[k]=Object.assign(S.runs[k]||{},{sec:+mm[1]*60+ +mm[2],at:Date.now()}); }
      if(pu!=null||su!=null) S.pt[k]={push:pu??0,sit:su??0,at:Date.now()};
      save(); closeSheet(); toast('Saved'); render(); break; }
    case 'pt-del': if(confirm('Delete this PT entry?')){ delete S.pt[D.v]; save(); render(); } break;
    case 'mile-del': if(confirm('Delete this 1.5-mile time?')){ delete S.runs[D.v].sec; if(!S.runs[D.v].min) delete S.runs[D.v]; save(); render(); } break;
    case 'ptseg': UI.ptSeg=D.v; render(); break;
    case 'energy': { const k=bodyDate(), c=S.checkins[k]=S.checkins[k]||{}; c.energy = c.energy===+D.v?null:+D.v; c.at=Date.now(); save(); render(); break; }
    case 'bday': { UI.date=addD(bodyDate(),+D.v); if(UI.date>todayK()) UI.date=todayK(); render(); break; }
    case 'prog': UI.prog=D.v; render(); break;
    case 't-15': T.end-=15000; if(T.end<Date.now()) T.end=Date.now(); tick(); break;
    case 't+15': if(T.ended){ T.end=Date.now(); T.dur=15; T.ended=false; document.getElementById('timer').classList.remove('end'); clearInterval(T.iv); T.iv=setInterval(tick,250); T.end+=15000; } else { T.end+=15000; T.dur+=15; } tick(); break;
    case 't-skip': T.next=null; stopTimer(); break;
    case 'close-sheet': closeSheet(); break;
    case 'edit-ex': exSheet(+D.b,D.d,+D.i); break;
    case 'add-ex': exSheet(+D.b,D.d,null); break;
    case 'seg': b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); break;
    case 'sw': b.classList.toggle('on'); break;
    case 'ex-save': { const day=getSlot(+D.b,D.d), name=document.getElementById('f-name').value.trim(); if(!name){toast('Give it a name');break;}
      const mn=num('f-min')??8, mx=Math.max(mn,num('f-max')??mn), rest=num('f-rest')||75;
      const obj={id:D.id,name,kind:segV('f-kind')||'db',sets:Math.max(1,Math.round(num('f-sets')||3)),min:mn,max:mx,side:swOn('f-side'),amrap:swOn('f-amrap'),rest,main:rest>=120,note:document.getElementById('f-note').value.trim(),start:num('f-start')||0};
      if(D.i==='') day.exercises.push(obj); else { const old=day.exercises[+D.i]; day.exercises[+D.i]=Object.assign({},old,obj); for(const e of allExercises()) if(e.id===obj.id){ e.name=obj.name; e.note=obj.note; } }
      save(); closeSheet(); toast('Program updated'); render(); break; }
    case 'ex-del': if(confirm('Remove this exercise from the day? Past sets stay in your history.')){ getSlot(+D.b,D.d).exercises.splice(+D.i,1); save(); closeSheet(); render(); } break;
    case 'mv': { const arr=getSlot(+D.b,D.d).exercises, i=+D.i, j=i+(+D.v); if(j<0) break; [arr[i],arr[j]]=[arr[j],arr[i]]; save(); render(); break; }
    case 'edit-day': daySheet(+D.b,D.d); break;
    case 'day-save': { const day=getSlot(+D.b,D.d); day.title=document.getElementById('d-title').value.trim()||day.title; day.tag=document.getElementById('d-tag').value.trim(); if(day.run&&document.getElementById('d-rmin')){ day.run.min=num('d-rmin')||day.run.min; day.run.max=Math.max(day.run.min,num('d-rmax')||day.run.max); } save(); closeSheet(); toast('Day updated'); render(); break; }
    case 'block-defaults': if(confirm('Restore the master plan template? Your logged history and settings stay.')){ S.program=defaultProgram(); save(); render(); toast('Master plan restored'); } break;
    case 'planb': UI.planB=+D.v; render(); break;
    case 'sleep': { const r=S.readiness[UI.date]; if(r&&r.low) delete S.readiness[UI.date]; else S.readiness[UI.date]={low:true,at:Date.now()}; save(); render(); break; }
    case 'iv': S.settings.intervalsOK = D.v==='1'?true:D.v==='0'?false:null; S.settings.intervalsAt=Date.now(); save(); render(); break;
    case 'iv-tg': S.settings.intervalsOK = S.settings.intervalsOK===true?false:true; S.settings.intervalsAt=Date.now(); save(); render(); break;
    case 'opt': { const s=sess(UI.date,true); s.optOn = D.v==='1'; save(); render(); break; }
    case 'use-cal': S.settings.calories=+D.v; save(); toast('Calorie target set'); render(); break;
    case 'tg': S.settings[D.v]=!S.settings[D.v]; save(); render(); break;
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'reset': if(confirm('Erase all data on this phone? Export a backup first if you want to keep it.') && confirm('Really erase everything?')){ S=freshState(); saveNow(); render(true); toast('Fresh start'); } break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.ci){ const c=S.checkins[bodyDate()]=S.checkins[bodyDate()]||{}; const v=parseFloat(t.value); if(isNaN(v)||v<0) delete c[t.dataset.ci]; else c[t.dataset.ci]=v; c.at=Date.now(); save(); render(); }
  else if(t.dataset.set){ const v=parseFloat(t.value); S.settings[t.dataset.set] = isNaN(v)||v<=0 ? null : v; save(); toast('Saved'); }
  else if(t.dataset.sete){ const v=t.value.trim();
    if(!v){ S.settings[t.dataset.sete]=null; save(); toast('Cleared'); render(); }
    else if(validEmail(v)){ S.settings[t.dataset.sete]=v; save(); toast('Saved'); render(); }
    else { t.value=S.settings[t.dataset.sete]||''; toast('Enter a valid email'); } }
  else if(t.dataset.setd){ S.settings[t.dataset.setd]=t.value||null; save(); toast(t.value?'Saved':'Cleared'); render(); }
  else if(t.dataset.f && UI.open){ commitInputs(); save(); }
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter' && ev.target.id==='c-email'){ ev.preventDefault(); coachEmailSave(); return; } if(ev.key==='Enter' && ev.target.matches('input')) ev.target.blur(); });

let lastDay=todayK();
setInterval(()=>{ const t=todayK(); if(t!==lastDay){ if(UI.date===lastDay) UI.date=t; lastDay=t; if(UI.tab==='today'&&!UI.open) render(); } },60000);

render(true);
let swWaiting=null;
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const hadCtrl=!!navigator.serviceWorker.controller; let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadCtrl && !reloading){ reloading=true; saveNow(); location.reload(); } });
  navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(reg=>{
    const offer=w=>{ swWaiting=w; toastSticky('Update available — tap to refresh','sw-refresh'); };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(!w) return; w.addEventListener('statechange',()=>{ if(w.state==='installed' && navigator.serviceWorker.controller) offer(w); }); });
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
}
</script>
</body>
